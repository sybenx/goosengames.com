<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goosen Games</title>
<meta name="description" content="Goosen Games">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#f5eddd">
<style>
  /* Act 1 of Same Great Taste: warm cream against the blue of the mark.
     Fixed, not theme-switched — the game commits to its palette too. */
  :root{
    --bg:#f5eddd;
    --ink2:#7a6a56;
    --accent:#a54f22;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(1.75rem, 5vmin, 3rem);
    padding:6vmin;
  }
  .logo{
    width:min(40vmin, 320px);
    height:auto;
    display:block;
  }
  .play{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    color:var(--ink2);
    text-decoration:none;
    font:400 .95rem/1 Georgia,'Iowan Old Style','Times New Roman',serif;
    letter-spacing:.01em;
    transition:color .18s ease;
  }
  .play svg{
    width:1.25em;
    height:1.25em;
    flex:none;
    overflow:visible;
  }
  .play span{
    border-bottom:1px solid currentColor;
    padding-bottom:.15em;
    opacity:.9;
  }
  .play:hover, .play:focus-visible{ color:var(--accent); }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>
  <h1 class="sr-only">Goosen Games</h1>
  <img class="logo" src="/logo.svg" alt="Goosen Games">

  <a class="play" href="/samegreattaste">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.5 10.5C3.5 5.9 7.3 2.5 12 2.5C16.7 2.5 20.5 5.9 20.5 10.5Z"/>
      <path d="M4.6 13.6H19.4"/>
      <path d="M3.9 16.6C4.3 19.2 7.6 21 12 21C16.4 21 19.7 19.2 20.1 16.6Z"/>
    </svg>
    <span>Same Great Taste</span>
  </a>
</body>
</html>
