    + kpi('Units / wk', nk('units', lw.units, 'n'), wow != null ? (wow >= 0 ? '+' : '−') + Math.abs(wow).toFixed(1) + '% wk/wk' : null, wow != null && wow >= 0 ? 'up' : 'dn')
    + kpi('Net / wk', nk('net', lw.net, '$'), null, lw.net >= 0 ? 'up' : 'dn')
    + kpi('Cash', nk('cash', S.cash, '$'))
    + (a3 ? kpi('COGS', nk('cogs', unitCost() / S.price * 100, 'pct'), fm$(unitCost()) + ' / ' + fm$(S.price))
          : kpi('Retention', nk('ret', (lw.retention || 0.5) * 100, 'pct')))
    + kpi('Brand trust', nk('brand', Math.round(S.brand || 62), 'i'), S.sponsored ? 'certified seal' : null, 'up')
    + kpi('Rival', nk('rival', Math.round(S.rival || 0), 'n'), 'Patty Palace Group')
    + (a3 ? kpi('Valuation', nk('val', S.valuation || 0, '$')) : '')
    + '</div>';

  // throughput graph
  const hist = S.history.slice(-28);
  if (hist.length > 2){
    const mx = Math.max.apply(null, hist.map(h => h.units));
    html += '<div class="card"><h2>' + (a3 ? 'Systemwide throughput' : 'Weekly units') + '</h2>'
      + '<div class="chart" role="img" aria-label="Weekly units, recent weeks">'
      + hist.map(h => '<div class="bar" style="height:' + Math.max(4, Math.round(h.units / mx * 70)) + 'px"></div>').join('')
      + '</div><div class="chart-legend"><span>' + fmN(hist[0].units) + ' → ' + nk('chartlast', hist[hist.length - 1].units, 'n') + ' units/wk</span></div></div>';
  }

  // act 3: IPO track (bar renders at its previous width; postRender eases it forward)
  if (a3){
    const p = Math.min(100, Math.round((S.valuation || 0) / CFG.ipoValuation * 100));
    html += '<div class="card"><h2>Enterprise value <span class="h-note">listing window at ' + fm$(CFG.ipoValuation) + '</span></h2>'
      + '<div style="background:var(--card2);border:1px solid var(--line);border-radius:8px;height:14px;overflow:hidden">'
      + '<div class="ipo-fill" data-w="' + p + '" style="height:100%;width:' + (IPO_W != null ? IPO_W : p) + '%;background:var(--accent)"></div></div>'
      + '<div class="small muted" style="margin-top:4px">' + nk('valbar', S.valuation || 0, '$') + ' · ' + nk('valpct', p, 'pct') + '</div></div>';
  }

  html += menuCardHTML();

  html += capitalCardHTML();

  // marketing — the spreadsheet, in the open
  const perStore = S.marketing / n;
  const mkPerK = Math.max(1, Math.round(perThousand('marketing')));
  html += '<div class="card"><h2>' + (a3 ? 'Marketing (auto-funded by allocator)' : 'Marketing') + '</h2>'
    + '<div class="sliderrow"><label for="mkt">' + (a3 ? 'Spend' : 'Budget') + '</label>'
    + '<input id="mkt" type="range" min="0" max="' + (CFG.marketingMax * n) + '" step="' + CFG.marketingStep + '" value="' + S.marketing + '" data-r="marketing"' + (a3 ? ' disabled' : '') + '>'
    + '<span class="val">' + nk('mkt', S.marketing, '$') + '/wk</span></div>'
    + '<div class="per-dollar">per extra $1k/wk · new customers: +' + nk('mkperk', mkPerK, 'i') + '/wk · '
    + (a3 ? 'loyalty cohort: +0/wk' : 'loyalty cohort: ≈ +0/wk') + '</div>'
    + (a3 ? '<div class="small muted">Campaign: “Same Great Taste — now in ' + fmN(n) + ' neighborhoods.”</div>'
          : '<div class="small muted">Radio, bus sides, the phone book. Reaches people who have never stood at your counter.</div>')
    + '</div>';

  // printed claims — legible, cheap, and fully honest as far as they go
  if (S.claimsUnlocked){
    html += '<div class="card"><h2>' + (a3 ? 'Label claims' : 'Printed claims') + ' <span class="h-note">stay printed only while inputs back them</span></h2>';
    Object.keys(CLAIMS).forEach(c => {
      const cl = CLAIMS[c];
      if (c === 'zerotf' && !S.oilReformAvailable && !S.legible.oil) return;
      const on = S.claims.includes(c);
      const ok = cl.req(S);
      html += '<div class="spread small" style="padding:3px 0"><span>“' + esc(cl.name) + '”'
        + (on && !ok ? ' <span class="tag">not currently true — unprinted</span>' : '') + '</span>'
        + '<button class="btn small ' + (on ? '' : 'quiet') + '" data-a="claim" data-c="' + c + '"' + (!on && !ok ? ' disabled' : '') + '>'
        + (on ? 'printed' : ok ? 'print it' : 'inputs don’t back it') + '</button></div>';
    });
    html += '</div>';
  }

  // procurement
  html += '<div class="card"><h2>' + (a3 ? 'Procurement · SKU schedule' : 'Procurement policy') + '</h2>';
  QUALITY_ATTRS.forEach(a => { html += tierRowsHTML(a); });
  html += '</div>';

  if (!a3){
    // the stores, line by line — itemization carries per-store detail while it lasts
    if (itemization01() > 0.3){
      html += '<div class="card"><h2>The stores</h2><div class="tblwrap"><table class="tbl">'
        + '<thead><tr><th>Store</th><th class="num">Units / wk</th><th class="num">vs last wk</th></tr></thead><tbody>'
        + S.stores.map(st => {
          const d = st.units - (st.prev || st.units);
          return '<tr><td class="t">Store #' + st.id + (st.id === 1 ? ' <span class="muted small">(the stand)</span>' : '') + '</td>'
            + '<td class="num">' + nk('st' + st.id, st.units, 'i') + '</td>'
            + '<td class="num" style="color:var(--' + (d >= 0 ? 'good' : 'bad') + ')">' + nk('std' + st.id, d, 'd') + '</td></tr>';
        }).join('')
        + '</tbody></table></div></div>';
    }

    // act 2 ops
    html += '<div class="card"><h2>Operations</h2>';
    const buildCost = Math.round(CFG.storeBuildCost * (S.waveCredits > 0 ? 1 - CFG.ownedWaveDiscount : 1));
    html += '<div class="optrow"><div class="grow"><span class="oname">Open Store #' + (n + 1) + '</span>'
      + '<div class="odesc">Fit-out ' + fm$(buildCost) + (S.waveCredits > 0 ? ' (wave discount applied)' : '') + ' · note ' + fm$(CFG.storeLoanWeekly) + '/wk · manager included</div></div>'
      + '<div class="ocost"><button class="btn small" data-a="openStore"' + (S.cash < buildCost ? ' disabled' : '') + '>open</button></div></div>';
    if (S.sop < 1){
      html += '<div class="optrow"><div class="grow"><span class="oname">Standard operating procedures</span>'
        + '<div class="odesc">Every store makes it the same way, every time. Variance down, retention up.</div></div>'
        + '<div class="ocost">' + fm$(6000) + '<br><button class="btn small quiet" data-a="buySop"' + (S.cash < 6000 ? ' disabled' : '') + '>roll out</button></div></div>';
    }
    if (S.testing < 1){
      html += '<div class="optrow"><div class="grow"><span class="oname">Supplier testing program</span>'
        + '<div class="odesc">Scheduled batch testing at volume. Incident probability down ' + Math.round(CFG.testingProgramCut * 50) + '%.</div></div>'
        + '<div class="ocost">' + fm$(12000) + '<br><button class="btn small quiet" data-a="buyTesting"' + (S.cash < 12000 ? ' disabled' : '') + '>fund</button></div></div>';
    }
    html += '</div>';

    // the counter, fading
    const weeksIn = S.week - S.act2StartWeek;
    html += '<div class="card"><h2>Store #1 <span class="h-note">the original counter</span></h2>'
      + '<div class="spread small"><span>Loyalty cohort retention</span><b class="mono">' + nk('ret1', (lw.retention || 0.5) * 100, 'pct') + '</b></div>';
    const EARLY_NOTES = ['You stopped by Thursday. Rosa waved from the corner table without looking up from the crossword.', 'You stopped by Thursday. Dot told the new manager exactly how to cut her Classic in half. He wrote it down.', 'You stopped by Thursday. Sam & Jo were splitting fries at the counter. The manager already knew their order.'];
    const LATE_NOTES = ['No time to stop by this week.', 'The manager’s Thursday note includes a doodle of the awning.', 'The week arrives as a one-page report. It is a good report.'];
    if (weeksIn <= 5){
      html += '<p class="sub" style="margin-top:6px">' + esc(EARLY_NOTES[S.week % EARLY_NOTES.length]) + '</p>';
    } else if (weeksIn <= 12){
      html += '<p class="sub" style="margin-top:6px">' + esc(LATE_NOTES[S.week % LATE_NOTES.length]) + '</p>';
    }
    html += '</div>';
  } else {
    // act 3 allocator
    html += '<div class="card"><h2>Free cash flow allocator</h2>';
    [['expand', 'Expansion'], ['marketing', 'Marketing'], ['ops', 'Ops & QA']].forEach(pair => {
      html += '<div class="sliderrow"><label for="al-' + pair[0] + '">' + pair[1] + '</label>'
        + '<input id="al-' + pair[0] + '" type="range" min="0" max="100" step="5" value="' + S.alloc[pair[0]] + '" data-r="alloc" data-k="' + pair[0] + '">'
        + '<span class="val">' + S.alloc[pair[0]] + '%</span></div>';
    });
    const per = CFG.act3ExpandCostPerStore;
    html += '<div class="per-dollar">expansion pool ' + nk('pool', S.expandPool || 0, '$') + ' / ' + fm$(per) + ' → next location</div>';
    html += '</div>';

    if (S.sponsored){
      html += '<div class="card"><h2>Compliance</h2><div class="spread small"><span>Uniform Safety & Compliance Standard — co-sponsor</span><span class="tag on">seal on every door</span></div>'
        + '<div class="small muted" style="margin-top:4px">Audit pass rate 99.2% · market conditions: independent segment consolidating</div></div>';
    }
  }
  return html;
}

function act4Screen(){

    + '</div>';
  const popLabel = word === 'served' ? 'The served' : word.charAt(0).toUpperCase() + word.slice(1);
  html += '<div class="kpis">'
    + kpi('Burgers served', nk('served', S.servedTotal, 'n'))
    + kpi(word === 'served' ? 'Output / wk' : 'Served / wk', nk('c4wk', c.servedWk, 'n'))
    + kpi(popLabel, nk('c4pop', Math.round(c.servedWk / 14), 'n'))
    + (c.done100 ? '' : kpi('Retention', nk('c4ret', 100 - c.churn, 'pct'), 'churn ' + c.churn.toFixed(1) + '%/yr'))
    + kpi('Cash', nk('cash', S.cash, '$'), '+' + fm$(c.income) + '/wk')
    + '</div>';
  html += '<div class="card ladder"><h2>Program line items</h2>';
  for (let i = 0; i < LADDER.length; i++){
    const r = LADDER[i];
    if (i < c.rung){
      // after retention reaches 100.00%, exit-related copy stops appearing
      const det = (c.done100 && r.exitCopy) ? '' : '<div class="odesc">' + esc(r.det) + '</div>';
      html += '<div class="optrow rung-done"><div class="grow"><span class="oname">✓ ' + esc(r.name) + '</span>'
        + det + '</div></div>';
    } else if (i === c.rung){
      html += '<div class="optrow current"><div class="grow"><span class="oname">' + esc(r.name) + '</span>'
        + '<div class="odesc">' + esc(r.det) + '</div></div>'
        + '<div class="ocost">' + nk('rungcost', c.cost, '$') + '<br><button class="btn small" data-a="buyRung"' + (S.cash < c.cost ? ' disabled' : '') + '>approve</button></div></div>';
      break;
    }
  }
  if (c.rung >= LADDER.length){
    html += '<div class="optrow"><div class="grow"><span class="oname muted">Program complete. Operations continue.</span></div></div>';
  }
  html += '</div>';
  return html;
}

/* ---- share ---- */
function shareText(){
  const local = S.ended === 'local';
  const verify = local ? 9 : verifiableCount();
  const lines = ['SAME GREAT TASTE — ' + endcardTitle()];
  lines.push(endcardLines().slice(0, 2).map(l => l[0] + ': ' + l[1]).join(' · '));
  if (S.interview && S.interview.regret) lines.push('“' + S.interview.regret + '”');
  lines.push('Attributes your customers could verify: 9 → ' + verify);
  lines.push('run ' + S.seed);
  return lines.join('\n');
}
function doShare(){
  const txt = shareText();
  const done = () => toast('End card copied.');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Copy this: ' + txt); }
    document.body.removeChild(ta);
  };
  try {
    const local = S.ended === 'local';
    const cv = document.createElement('canvas'); cv.width = 540; cv.height = 940;
    const g = cv.getContext('2d');
    g.fillStyle = local ? '#fdf6e7' : '#101722'; g.fillRect(0, 0, 540, 940);
    g.fillStyle = local ? '#3b2f24' : '#e8edf5';
    g.textAlign = 'center';
    g.font = '600 20px system-ui'; g.fillText('SAME GREAT TASTE', 270, 90);
    g.font = '700 40px Georgia'; g.fillText(endcardTitle(), 270, 150);
    g.font = '24px system-ui';
    const lines = endcardLines();
    g.fillText(lines[0][0] + ': ' + lines[0][1], 270, 300);
    g.fillText(lines[1][0] + ': ' + lines[1][1], 270, 336);
    if (S.interview && S.interview.regret){
      g.font = 'italic 21px Georgia';
      g.fillText('“' + S.interview.regret + '”', 270, 470);
    }
    g.font = '26px system-ui';
    g.fillText('Attributes your customers', 270, 560);
    g.fillText('could verify', 270, 596);
    g.font = '700 64px Georgia';
    g.fillText('9 → ' + (local ? 9 : verifiableCount()), 270, 690);
    g.font = '16px monospace'; g.globalAlpha = 0.6;
    g.fillText('run ' + S.seed, 270, 880);
    if (navigator.clipboard && window.ClipboardItem){
      cv.toBlob(blob => {
        if (!blob){ navigator.clipboard.writeText(txt).then(done, fallback); return; }
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob, 'text/plain': new Blob([txt], { type: 'text/plain' }) })])
          .then(done)
          .catch(() => navigator.clipboard.writeText(txt).then(done, fallback));
      });
    } else if (navigator.clipboard){ navigator.clipboard.writeText(txt).then(done, fallback); }
    else fallback();
  } catch (e) {
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  }
}

// remember what had keyboard focus so full re-renders don't drop it to <body>
function focusSignature(){
  const el = document.activeElement;
  if (!el || el === document.body) return null;
  if (el.id) return '#' + el.id;
  if (el.dataset && el.dataset.a){
    let sel = '[data-a="' + el.dataset.a + '"]';
    ['attr', 'i', 'c', 'u', 'd', 'k'].forEach(k => {
      if (el.dataset[k] != null) sel += '[data-' + k + '="' + el.dataset[k] + '"]';
    });
    return sel;
  }
  return null;
}
function render(){
  if (!S){
    document.body.dataset.act = '1';
    app.innerHTML = titleScreen();
    AUDIO.setScene('quiet');
    ensureTicker();
    return;
  }
  if (!S.finePrintY1) S.finePrintY1 = { fp: finePrintParts(), price: S.price };
  let act = S.act;
  if (S.ended === 'local') act = 1;
  else if (S.ended) act = 3;
  if (act === 4) act = 3; // the Continuation keeps the terminal's face
  if (S.screen === 'sign') act = 'sign';
  document.body.dataset.act = String(act);
  let html = '';
  switch (S.screen){
    case 'act1': html = act1Screen(); break;
    case 'act2': case 'act3': html = scaleScreen(); break;
    case 'act4': html = act4Screen(); break;
    case 'ceremony': html = ceremonyScreen(); break;
    case 'interview': html = interviewScreen(); break;
    case 'sign': html = signScreen(); break;
    case 'credits': html = creditsScreen(); break;
    case 'endcard': html = endcardScreen(); break;
    case 'sentence': html = sentenceScreen(); break;
    default: html = act1Screen();
  }
  html += modalHTML();
  const sig = focusSignature();
  const hadFocus = sig != null;
  app.innerHTML = html;
  if (S.modal){
    // keep the player's place if they had already tabbed within this modal
    const prior = sig && app.querySelector(sig);
    if (prior && prior.closest('.modal') && !prior.disabled){ prior.focus(); }
    else {
      const first = app.querySelector('.modal .choice:not([disabled])');
      if (first) first.focus();
    }
  } else if (FOCUS_NEXT){
    const el = app.querySelector(FOCUS_NEXT);
    if (el && !el.disabled) el.focus();
  } else if (hadFocus){
    let el = sig && app.querySelector(sig);
    if (!el) el = app.querySelector('.actionbar .btn') || app.querySelector('[data-a]');
    if (el && !el.disabled) el.focus();
  }
  FOCUS_NEXT = null;
  postRender();
  ensureTicker();
}
let FOCUS_NEXT = null;
function resetNumCache(){ Object.keys(NUMC).forEach(k => { delete NUMC[k]; }); }

const ACTIONS = {
  newRun(el){
    const inp = document.getElementById('seedin');
    const seed = inp && inp.value.trim() ? inp.value.trim().toUpperCase() : null;
    clearSave();
    resetNumCache();
    S = newRun(seed);
    S.finePrintY1 = { fp: finePrintParts(), price: S.price }; // the menu as it was, kept for the credits
    save(); render();
    toast('Week one. The griddle is hot.');
  },
  continueRun(){
    const s = loadSave();
    if (s){
      S = s;
      S.resolving = false; // never restore into a mid-resolution state
      if (S.screen === 'sign' && !S.signLinesOn) S.signT0 = Date.now(); // the idle clock restarts
      resetNumCache();
      rng = mulberry32(hashSeed(S.seed) + S.week * 7919);
      render();
    } else {
      toast('No saved run found.');
      render();
    }
  },
  settings(){ S.modal = { id: 'settings' }; render(); },
  pause(){ S.paused = !S.paused; render(); },
  price(el){
    const d = Number(el.dataset.d);
    const np = Math.round((S.price + d * 0.25) * 100) / 100;
    if (np < 1) return;
    if (d > 0){
      const overFair = np > fairPrice();
      S.regulars.forEach(r => { r.trust = Math.max(5, r.trust - CFG.priceRaiseTrustCost * (overFair ? 1 : 0.45)); });
    }
    S.price = np;
    if (S.act === 1) AUDIO.chalk(); // rewriting the board
    save(); render();
  },
  setTier(el){ setTier(el.dataset.attr, Number(el.dataset.i)); save(); render(); },
  claim(el){
    const c = el.dataset.c;
    const i = S.claims.indexOf(c);
    if (i >= 0) S.claims.splice(i, 1);
    else if (CLAIMS[c].req(S)) S.claims.push(c);
    save(); render();
  },
  chat(){
    if (S.chattedWeek === S.week) return;
    const r = pick(S.regulars);
    r.trust = Math.min(100, r.trust + CFG.chatTrust);
    S.chattedWeek = S.week; S.lastChat = r.name;
    S.feed.unshift({ who: r.name, note: pick(['tells you about the week — the hour goes somewhere good.', 'lingers over coffee. You learn the story behind “' + r.order + '.”', 'says this corner would be different without you. You say likewise.']), delta: '+trust' });
    save(); render();
  },
  buy(el){
    const u = el.dataset.u;
    const costs = { griddle: 900, griddle2: 1400, awning: 350, flyers: 120, apprentice: 0 };
    if (S.cash < costs[u]) return;
    S.cash -= costs[u];
    S.upgrades[u] = true;
    if (u === 'awning') S.walkins += 10;
    if (u === 'flyers') S.walkins += 6;
    if (u === 'apprentice') toast('Maya starts Saturday.');
    save(); render();
  },
  endWeek(){
    if (S.modal || S.resolving) return;
    const done = () => {
      S.resolving = false;
      resolveWeekAct1();
      AUDIO.paper();
      setTimeout(() => AUDIO.coin(), 140);
      FOCUS_NEXT = '[data-a="endWeek"]'; // keyboard players keep their place across the beat
      save(); render();
    };
    if (RM.matches){ done(); return; } // reduced motion: the week resolves instantly
    S.resolving = true;
    render();
    setTimeout(done, CFG.resolveMs);
  },
  mute(){
    AUDIO.setMuted(!AUDIO.muted);
    render();
  },
  choose(el){
    const m = S.modal;
    if (!m) return;
    resolveModal(m, el.dataset.c);
    if (!S){ render(); return; } // reset from settings
    closeModal();
  },
  openStore(){
    const discounted = S.waveCredits > 0;
    const cost = Math.round(CFG.storeBuildCost * (discounted ? 1 - CFG.ownedWaveDiscount : 1));
    if (S.cash < cost) return;
    S.cash -= cost;
    if (discounted) S.waveCredits--;
    S.debtWeekly += CFG.storeLoanWeekly;
    addStore();
    syncTier();
    toast('Store #' + S.storeCount + ' opens in three weeks’ worth of paperwork, i.e., immediately.');
    save(); render();
  },
  offerPartner(){ S.modal = { id: 'meridianOffer' }; render(); },
  offerFranchise(){ S.modal = { id: 'franchiseOffer' }; render(); },
  buyAudits(){
    if (S.cash < CFG.auditProgramCost || S.auditProgram) return;
    S.cash -= CFG.auditProgramCost; S.auditProgram = 1;
    toast('Audit program funded. Checklists measure what checklists can measure.');
    save(); render();
  },
  buyRung(){ buyRung(); },
  toInterview(){
    buildInterview();
    S.screen = 'interview';
    save(); render();
  },
  ivRecall(el){
    const iv = S.interview;
    iv.recall = iv.recallOptions[Number(el.dataset.i)];
    iv.recallRight = iv.recall === iv.recallCorrect;
    iv.step = 1;
    save(); render();
  },
  ivRegret(el){
    const iv = S.interview;
    iv.regret = iv.regretOptions[Number(el.dataset.i)];
    iv.step = 2;
    save(); render();
  },
  toCredits(){ S.screen = 'credits'; save(); render(); },
  buySop(){ if (S.cash >= 6000 && S.sop < 1){ S.cash -= 6000; S.sop = 1; toast('SOPs rolled out. Every Classic, the same.'); save(); render(); } },
  buyTesting(){ if (S.cash >= 12000 && S.testing < 1){ S.cash -= 12000; S.testing = 1; toast('Testing program funded.'); save(); render(); } },
  toEndcard(){ S.screen = 'endcard'; save(); render(); },
  toSentence(){ S.screen = 'sentence'; save(); render(); },
  share(){ doShare(); },
  sandbox(){
    S.endless = true;
    S.screen = 'act' + S.act;
    toast('The run continues. Nothing else is waiting at the end — this part is yours.');
    save(); render();
  },
  restart(){ clearSave(); resetNumCache(); S = null; render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  // while a decision is on the table, only the decision is live —
  // keyboard focus can reach background controls, so guard here too
  if (S && S.modal && el.dataset.a !== 'choose' && el.dataset.a !== 'mute') return;
  if (S && S.resolving && el.dataset.a !== 'mute') return;
  const fn = ACTIONS[el.dataset.a];
  if (fn){
    AUDIO.uiClick();
    fn(el);
  }
});
// keep keyboard focus inside an open modal
document.addEventListener('keydown', e => {
  if (!S || !S.modal || e.key !== 'Tab') return;
  const f = Array.prototype.slice.call(app.querySelectorAll('.modal .choice:not([disabled])'));
  if (!f.length) return;
  e.preventDefault();
  const i = f.indexOf(document.activeElement);
  const n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1);
  f[n].focus();
});
// don't let auto-tick re-renders interrupt a slider drag
let POINTER_DRAG = false;
document.addEventListener('pointerdown', e => {
  if (e.target && e.target.matches && e.target.matches('input[type=range]')) POINTER_DRAG = true;
});
document.addEventListener('pointerup', () => { POINTER_DRAG = false; });
document.addEventListener('pointercancel', () => { POINTER_DRAG = false; });
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.r) return;
  if (el.dataset.r === 'vol'){ AUDIO.setVol(Number(el.value) / 100); return; }
  if (!S) return;
  if (el.dataset.r === 'marketing'){
    S.marketing = Number(el.value);
    const lab = el.parentNode.querySelector('.val');
    if (lab) lab.textContent = fm$(S.marketing) + '/wk';
    save();
  } else if (el.dataset.r === 'alloc'){
    const k = el.dataset.k;
    S.alloc[k] = Number(el.value);
    const lab = el.parentNode.querySelector('.val');
    if (lab) lab.textContent = S.alloc[k] + '%';
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.r || !S) return;
  if (el.dataset.r === 'marketing'){ render(); }
  else if (el.dataset.r === 'alloc'){
    const k = el.dataset.k;
    S.alloc[k] = Number(el.value);
    const keys = ['expand', 'marketing', 'ops'];
    const others = keys.filter(x => x !== k);
    const rest = 100 - S.alloc[k];
    const sumOthers = others.reduce((t, x) => t + S.alloc[x], 0) || 1;
    S.alloc[others[0]] = Math.round(rest * S.alloc[others[0]] / sumOthers / 5) * 5;
    S.alloc[others[1]] = Math.max(0, rest - S.alloc[others[0]]);
    save(); render();
  }
});

/* ---- ticker ---- */
function stopTicker(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }
function ensureTicker(){
  stopTicker();
  if (!S || S.ended && !S.endless) return;
  if (S.screen === 'act2' || S.screen === 'act3'){
    const base = S.act === 3 ? CFG.act3TickMs : CFG.act2TickMs;
    const ms = S.devFF ? Math.max(120, base / CFG.devFFMult) : base;
    tickTimer = setInterval(() => {
      if (S.modal || S.paused || document.hidden) return;
      resolveWeekScale();
      if (S.week % 5 === 0) save();
      if (!POINTER_DRAG) render();
    }, ms);
  } else if (S.screen === 'act4'){
    const ms = S.devFF ? Math.max(120, CFG.act4TickMs / CFG.devFFMult) : CFG.act4TickMs;
    tickTimer = setInterval(() => {
      if (S.modal || S.paused || document.hidden) return;
      resolveWeekAct4();
      if (S.week % 5 === 0) save();
      if (!POINTER_DRAG) render();
    }, ms);
  } else if (S.screen === 'sign'){
    // the sign never freezes: one text node ticks, nothing else re-renders
    let saveCounter = 0;
    tickTimer = setInterval(() => {
      const perTick = (S.c4 ? S.c4.servedWk : 1000000) / 4032000; // week → 150ms slices
      S.servedTotal += perTick;
      const el = document.getElementById('signcount');
      if (el) el.textContent = Math.round(S.servedTotal).toLocaleString('en-US');
      if (!S.signLinesOn && Date.now() - (S.signT0 || 0) > CFG.signIdleMs){
        S.signLinesOn = true;
        const l = document.getElementById('signlines');
        if (l) l.classList.add('on');
      }
      if (++saveCounter % 200 === 0) save();
    }, 150);
  } else if (S.screen === 'act1' && S.devFF){
    tickTimer = setInterval(() => {
      if (S.modal || S.resolving || document.hidden) return;
      resolveWeekAct1();
      if (S.week % 5 === 0) save();
      render();
    }, CFG.act1AutoMs);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) render(); });

/* ---- boot ---- */
(function boot(){
  // land on the title; if a run is saved, the Continue button picks it up
  render();
})();
</script>
