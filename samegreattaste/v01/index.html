<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Same Great Taste</title>
<style>
/* ============================================================
   SAME GREAT TASTE — styles
   Three act themes share one component set. The theme drifts;
   the components (and the product photo) do not.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
img,svg{display:block;max-width:100%}

:root{
  --maxw:700px;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,14,8,.08),0 6px 24px rgba(20,14,8,.07);
}

/* ---- Act 1: the stand. Warm cream, chalk green, hand-set serif. ---- */
body{
  --bg:#f5eddd;
  --bg2:#efe4cf;
  --card:#fffaf0;
  --card2:#fdf3e0;
  --ink:#3b2f24;
  --ink2:#7a6a56;
  --line:#e4d6bd;
  --accent:#a54f22;
  --accent-ink:#fff6ec;
  --good:#48732e;
  --bad:#a2452c;
  --chalk-bg:#33473a;
  --chalk-ink:#f2ead6;
  --focus:#a54f22;
  --font-display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --font-body:Georgia,'Iowan Old Style','Times New Roman',serif;
  --font-num:Georgia,serif;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;line-height:1.45;
  min-height:100vh;
}
/* ---- Act 2: the stores. Cool paper, ledger blue, clean sans. ---- */
body[data-act="2"]{
  --bg:#eef1f5;
  --bg2:#e4e9f0;
  --card:#ffffff;
  --card2:#f4f7fb;
  --ink:#1d2733;
  --ink2:#5b6a7d;
  --line:#dde4ec;
  --accent:#2f5da8;
  --accent-ink:#f4f8ff;
  --good:#2e7d4f;
  --bad:#b3502f;
  --chalk-bg:#22314a;
  --chalk-ink:#e9eef7;
  --focus:#2f5da8;
  --font-display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
/* ---- Act 3: the company. Deep navy SaaS, crisp, luminous. ---- */
body[data-act="3"]{
  --bg:#10161f;
  --bg2:#0b1017;
  --card:#1a2230;
  --card2:#212c3d;
  --ink:#e8edf5;
  --ink2:#8b99ad;
  --line:#2a3547;
  --accent:#4f8ef7;
  --accent-ink:#0d1522;
  --good:#4cc38a;
  --bad:#e0704f;
  --chalk-bg:#0b1017;
  --chalk-ink:#e8edf5;
  --focus:#4f8ef7;
  --font-display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}

#app{max-width:var(--maxw);margin:0 auto;padding:12px 14px 90px;min-height:100vh}
@media(min-width:900px){#app{padding-top:24px}}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--chalk-bg);color:var(--chalk-ink);
  border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;
  box-shadow:var(--shadow);
}
.topbar .brand{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;font-size:1.02em;margin-right:auto}
.topbar .stat{font-family:var(--font-num);font-size:.86em;opacity:.95;white-space:nowrap}
.topbar .stat b{font-weight:700}
.topbar .sub{width:100%;font-size:.78em;opacity:.75;margin-top:-2px}

/* ---- cards ---- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.card h2{font-family:var(--font-display);font-size:1.02em;margin-bottom:8px;letter-spacing:.01em}
.card h2 .h-note{font-weight:400;color:var(--ink2);font-size:.85em;margin-left:6px}
.card .sub{color:var(--ink2);font-size:.88em}
.hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ---- kpi grid ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi .k{font-size:.72em;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--font-num);font-size:1.08em;font-weight:700;margin-top:2px}
.kpi .d{font-size:.74em;color:var(--ink2)}
.kpi .d.up{color:var(--good)}.kpi .d.dn{color:var(--bad)}

/* ---- buttons ---- */
.btn{
  display:inline-block;background:var(--accent);color:var(--accent-ink);
  border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95em;
  border:1px solid transparent;text-align:center;
}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:.84em;font-weight:600}
.btn.wide{display:block;width:100%}
.btn.quiet{background:var(--card2);color:var(--ink);border-color:var(--line);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btnrow .btn{flex:1;min-width:130px}

/* ---- menu card (the photo never changes) ---- */
.menu-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);
}
.menu-card .photo{background:linear-gradient(180deg,var(--card2),var(--card));padding:10px 0 2px}
.menu-card .photo svg{width:172px;margin:0 auto}
.menu-card .mtitle{
  font-family:var(--font-display);font-weight:700;font-size:1.12em;
  text-align:center;padding:2px 12px 0;
}
.menu-card .mprice{font-family:var(--font-num);text-align:center;font-size:1.05em;font-weight:700;color:var(--accent);padding:1px 0 4px}
.menu-card .fineprint{
  color:var(--ink2);font-size:.78em;line-height:1.5;text-align:center;
  padding:0 18px 12px;font-style:italic;
}
body[data-act="3"] .menu-card .fineprint{font-style:normal}

/* ---- counter feed ---- */
.feed{list-style:none}
.feed li{padding:7px 2px;border-bottom:1px dashed var(--line);font-size:.93em}
.feed li:last-child{border-bottom:0}
.feed .who{font-weight:700}
.feed .note{color:var(--ink2)}
.feed .delta{font-family:var(--font-num);font-size:.85em}
.feed .delta.up{color:var(--good)}.feed .delta.dn{color:var(--bad)}

/* ---- choice rows (suppliers, policies) ---- */
.optrow{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.optrow:last-child{border-bottom:0}
.optrow .grow{flex:1;min-width:0}
.optrow .oname{font-weight:700;font-size:.95em}
.optrow .odesc{color:var(--ink2);font-size:.82em;line-height:1.4}
.optrow .ocost{font-family:var(--font-num);font-size:.88em;white-space:nowrap;text-align:right}
.optrow.current{background:var(--card2);border-radius:10px;padding:8px;border-bottom-color:transparent}
.tag{display:inline-block;font-size:.7em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink2);vertical-align:1px}
.tag.on{color:var(--accent);border-color:var(--accent)}

/* ---- sliders ---- */
.sliderrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.sliderrow label{font-size:.88em;min-width:86px}
.sliderrow input[type=range]{flex:1;accent-color:var(--accent);min-height:28px}
.sliderrow .val{font-family:var(--font-num);font-size:.88em;min-width:72px;text-align:right}
.per-dollar{font-size:.78em;color:var(--ink2);font-family:var(--font-num);margin:2px 0 8px}

/* ---- tables ---- */
.tbl{width:100%;border-collapse:collapse;font-size:.86em}
.tbl th{color:var(--ink2);text-transform:uppercase;font-size:.76em;letter-spacing:.05em;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px dashed var(--line);font-family:var(--font-num);position:relative}
.tbl td.t{font-family:var(--font-body)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tblwrap{overflow-x:auto}

/* ---- bar chart (plain divs; battery-light) ---- */
.chart{display:flex;align-items:flex-end;gap:2px;height:74px;padding:4px 0}
.chart .bar{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-width:2px}
.chart .bar.b2{background:var(--ink2);opacity:.5}
.chart-legend{display:flex;gap:14px;font-size:.76em;color:var(--ink2)}
.chart-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* ---- line-ish trend (predict reveals) ---- */
.trend{display:flex;align-items:flex-end;gap:3px;height:64px}
.trend span{flex:1;border-radius:2px;min-width:3px}

/* ---- modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(24,18,10,.45);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;
}
body[data-act="3"] .overlay{background:rgba(4,8,14,.6)}
.modal{
  background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 12px 48px rgba(10,8,4,.35);
  width:100%;max-width:480px;max-height:86vh;overflow-y:auto;padding:18px;
}
.modal h3{font-family:var(--font-display);font-size:1.06em;margin-bottom:4px}
.modal .kicker{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.modal p{margin:8px 0;font-size:.94em}
.modal .choices{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.modal .choice{
  text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  background:var(--card2);width:100%;
}
.modal .choice .cname{font-weight:700;font-size:.95em}
.modal .choice .cdesc{color:var(--ink2);font-size:.83em;font-family:var(--font-num);margin-top:2px}
.modal .choice:not(:disabled):hover{border-color:var(--accent)}
.memo{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88em;margin:8px 0}
.memo .mh{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}

/* ---- toast ---- */
#toasts{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;padding:0 14px}
.toast{
  background:var(--chalk-bg);color:var(--chalk-ink);border-radius:10px;padding:8px 14px;
  font-size:.88em;box-shadow:var(--shadow);max-width:var(--maxw);
}

/* ---- sticky action bar (act 1) ---- */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,transparent,var(--bg) 34%);
  padding:18px 14px 14px;display:flex;justify-content:center;
}
.actionbar .inner{width:100%;max-width:var(--maxw);display:flex;gap:8px}
.actionbar .btn{flex:1;padding:12px;font-size:1em}

/* ---- title & endings ---- */
.title-screen{text-align:center;padding-top:6vh}
.title-screen .logo{font-family:var(--font-display);font-size:2em;font-weight:700;letter-spacing:.01em;margin:10px 0 2px}
.title-screen .tagline{color:var(--ink2);font-style:italic;margin-bottom:18px}
.title-screen svg{width:190px;margin:0 auto}
.title-screen .menu-board{
  display:inline-block;background:var(--chalk-bg);color:var(--chalk-ink);
  border-radius:14px;padding:14px 26px;margin:8px 0 20px;box-shadow:var(--shadow);
}
.title-screen .menu-board .b1{font-family:var(--font-display);font-size:1.1em;font-weight:700}
.title-screen .menu-board .b2{font-size:.8em;opacity:.8;font-style:italic}
.stack{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto}
.seedline{color:var(--ink2);font-size:.78em;font-family:var(--font-num);margin-top:14px}

.credits{max-width:var(--maxw);margin:0 auto;padding-top:4vh}
.credits h1{font-family:var(--font-display);text-align:center;font-size:1.3em;margin-bottom:16px}
.menus-compare{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.menus-compare{grid-template-columns:1fr 1fr}}
.menus-compare .yr{font-size:.74em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);text-align:center;margin-bottom:6px}

.endcard-wrap{display:flex;justify-content:center;padding:4vh 0 2vh}
.endcard{
  width:min(340px,92vw);aspect-ratio:9/16.4;border-radius:26px;
  padding:26px 22px;display:flex;flex-direction:column;
  box-shadow:0 18px 60px rgba(8,6,2,.4);border:1px solid var(--line);
}
.endcard.scale{background:linear-gradient(165deg,#151d2a,#0c1119);color:#e8edf5;border-color:#2a3547}
.endcard.local{background:linear-gradient(165deg,#fffaf0,#f3e8d2);color:#3b2f24;border-color:#e4d6bd}
.endcard .ec-brand{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.endcard .ec-title{font-family:var(--font-display);font-weight:700;font-size:1.28em;margin:2px 0 10px}
.endcard svg{width:110px;margin:6px auto 10px}
.endcard .ec-lines{margin-top:auto}
.endcard .ec-line{display:flex;justify-content:space-between;gap:10px;font-size:.85em;padding:5px 0;border-top:1px dashed currentColor;opacity:.92}
.endcard .ec-line b{font-family:var(--font-num)}
.endcard .ec-verify{margin-top:12px;padding:12px 10px;border-radius:12px;text-align:center;font-size:.9em}
.endcard.scale .ec-verify{background:#1d2836}
.endcard.local .ec-verify{background:#fff6e4}
.endcard .ec-verify b{font-size:1.25em;font-family:var(--font-num)}
.endcard .ec-regret{font-style:italic;text-align:center;font-size:.88em;opacity:.85;margin-top:10px}
.endcard .ec-seed{text-align:center;font-family:var(--font-num);font-size:.7em;opacity:.6;margin-top:10px}

.sentence-screen{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.sentence-screen .the-sentence{font-family:var(--font-display);font-size:1.28em;line-height:1.5;max-width:430px}
.sentence-screen .the-pattern{color:var(--ink2);font-size:.9em;margin-top:18px;max-width:380px}
.sentence-screen .the-pattern b{font-style:italic}

/* ---- inbox chips (act 3) ---- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--accent);color:var(--accent);
  border-radius:999px;padding:6px 12px;font-size:.84em;font-weight:700}

/* ---- misc ---- */
.center{text-align:center}
.muted{color:var(--ink2)}
.mono{font-family:var(--font-num)}
.small{font-size:.84em}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.footer-tools{margin-top:20px;text-align:center}
.footer-tools .btn{margin:0 4px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- input feedback floor ---- */
button{-webkit-tap-highlight-color:transparent}
.btn:disabled,.choice:disabled{cursor:not-allowed}
.choice:disabled{opacity:.5}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
input[type=range]:not(:disabled):hover{filter:brightness(1.12)}
input[type=range]:not(:disabled):active{filter:brightness(.94)}
@media(hover:hover){
  .btn:not(:disabled):hover{filter:brightness(1.07)}
  .btn.quiet:not(:disabled):hover,.btn.ghost:not(:disabled):hover{border-color:var(--accent);filter:none;background:var(--card2)}
  .choice:not(:disabled):hover{border-color:var(--accent);background:var(--card)}
  .kpi:hover{border-color:var(--line)}
}
.btn:not(:disabled):active{filter:brightness(.92)}
.choice:not(:disabled):active{filter:brightness(.95)}

/* the week passing */
.btn.resolving{position:relative;overflow:hidden;opacity:.85;pointer-events:none}

/* changed-number highlight (color only — safe under reduced motion) */
.kpi,.nkv{transition:background-color .5s ease,border-color .5s ease}
.kpi.hl{border-color:var(--accent);background:var(--card2)}
.nkv{border-radius:4px}
.nkv.hl{background:var(--card2);box-shadow:0 0 0 3px var(--card2)}

/* the receipt (act 1) */
.receipt{
  background:var(--card2);border:1px dashed var(--ink2);border-radius:4px;
  padding:10px 12px;margin-bottom:10px;font-size:.86em;
}
.receipt .r-head{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px;text-align:center}
.receipt ul{list-style:none}
.receipt li{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0}
.receipt li b{font-family:var(--font-num);white-space:nowrap}
.receipt li .rv-up{color:var(--good)}
.receipt li .rv-dn{color:var(--bad)}
.receipt li.r-net{border-top:1px dashed var(--ink2);margin-top:4px;padding-top:6px;font-weight:700}
.receipt li.r-info{color:var(--ink2);font-style:italic}

/* floaters (acts 2-3) */
.kpi{position:relative}
.floater{
  position:absolute;right:8px;top:2px;pointer-events:none;z-index:5;
  font-family:var(--font-num);font-size:.76em;font-weight:700;opacity:0;
}
.floater.up{color:var(--good)}.floater.dn{color:var(--bad)}

/* confetti + badge */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti-layer span{position:absolute;top:-4vh;width:8px;height:12px;border-radius:2px;opacity:.9}
.badge-toast{font-weight:700}

/* the mark */
.mark{display:inline-block;vertical-align:-4px;width:20px;height:20px;margin-right:6px}
.mark svg{width:100%;height:100%}
.receipt .mark{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.endcard .mark{width:26px;height:26px;margin-right:0}

/* capital card */
.cap-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cap-row:last-child{border-bottom:0}
.cap-row .grow{flex:1;min-width:0}
.cap-row .cname{font-weight:700;font-size:.95em}
.cap-row .cdet{color:var(--ink2);font-size:.82em;line-height:1.45;font-family:var(--font-num)}

/* interview */
.interview{max-width:520px;margin:0 auto;padding-top:5vh}
.interview .iv-kicker{font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;text-align:center}
.interview .iv-q{font-family:var(--font-display);font-size:1.14em;margin:14px 0 14px;text-align:center}
.interview .iv-note{color:var(--ink2);font-size:.84em;text-align:center;margin-bottom:16px}
.interview .choices{display:flex;flex-direction:column;gap:8px}

/* ceremony */
.ceremony{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.ceremony .cer-kicker{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.ceremony h1{font-family:var(--font-display);font-size:1.5em;margin:10px 0 6px}
.ceremony p{max-width:440px;color:var(--ink2);margin:6px 0}
.ceremony .btn{margin-top:22px}

/* act 4: the Continuation */
.ladder .optrow .oname{font-family:var(--font-num);font-weight:600}
.ladder .optrow .odesc{font-family:var(--font-num)}
.rung-done{color:var(--ink2)}
.rung-done .oname{font-weight:600}
.churn-cite{font-family:var(--font-num);font-size:.82em;color:var(--ink2)}

/* the sign */
body[data-act="sign"]{--bg:#101010;background:#101010}
.sign-screen{
  min-height:96vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:6px;padding:20px;
}
.sign-board{
  background:#f7c377;border:6px solid #a54f22;border-radius:22px;
  padding:26px 30px 22px;max-width:340px;width:92vw;
  box-shadow:0 0 80px rgba(247,195,119,.18),0 14px 50px rgba(0,0,0,.5);
}
.sign-board .mark{width:64px;height:64px;margin:0 auto 4px;display:block}
.sign-board .sign-name{font-family:var(--font-display);font-weight:700;font-size:1.3em;color:#3b2f24;letter-spacing:.02em}
.sign-board svg.burger{width:130px;margin:10px auto}
.sign-board .sign-count-label{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:#7a5b33}
.sign-board .sign-count{font-family:var(--font-num);font-weight:700;font-size:1.5em;color:#3b2f24;font-variant-numeric:tabular-nums}
.sign-lines{margin-top:26px;opacity:0;color:#8a8a84;font-size:.92em;max-width:420px}
.sign-lines.on{opacity:1}
@media(prefers-reduced-motion:no-preference){.sign-lines{transition:opacity 2.5s ease}}
.sign-lines .sl-verify{font-family:var(--font-num);margin-bottom:10px}
.sign-lines .sl-sentence{font-family:var(--font-display);line-height:1.5}

/* audio controls */
.audioctl{display:inline-flex;align-items:center;gap:6px;margin-left:2px}
.audioctl .volslider{width:64px;accent-color:var(--accent);min-height:24px}
.audioctl-row{display:flex;justify-content:center;margin-top:12px}

@media(prefers-reduced-motion:no-preference){
  .modal{animation:pop .18s ease-out}
  .toast{animation:rise .2s ease-out}
  .ipo-fill{transition:width .5s ease}
  .btn:not(:disabled):active{transform:translateY(1px)}
  .btn.resolving::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:wipe .55s linear infinite;
  }
  .kpi.hl{animation:kpulse .45s ease-out}
  .receipt.fresh{animation:slipin .35s ease-out}
  .floater{animation:floatup .95s ease-out forwards}
  .confetti-layer span{animation:confall var(--dur,1.1s) ease-in forwards}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes wipe{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  @keyframes kpulse{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
  @keyframes slipin{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes floatup{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
  @keyframes confall{from{transform:translateY(-6vh) rotate(0deg)}to{transform:translateY(108vh) rotate(var(--rot,520deg));opacity:.2}}
}
@media(prefers-reduced-motion:reduce){
  .floater{opacity:1;transition:opacity .6s ease .6s}
}

/* ============================================================
   RNG — seeded, deterministic per run.
   ============================================================ */
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = Math.random; // replaced by seeded rng at run start
function rnd(a, b){ return a + rng() * (b - a); }
function chance(p){ return rng() < p; }
function pick(arr){ return arr[Math.floor(rng() * arr.length)]; }
function makeSeed(){
  const c = 'ABCDEFGHJKMNPQRSTVWXYZ23456789';
  let s = 'SGT-';
  for (let i = 0; i < 5; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}

}
function makeRegular(s){
  let def;
  if (s.nextRegularIdx < CORE_REGULARS.length){
    def = CORE_REGULARS[s.nextRegularIdx];
  } else {
    const first = NAME_POOL_FIRST[(s.nextRegularIdx - CORE_REGULARS.length) % NAME_POOL_FIRST.length];
    def = { name: first, tag: pick(NAME_POOL_TAG), order: pick(['Classic','Classic, extra pickle','Classic, no onion','Classic, well done','Classic, to go','Classic, extra sauce']) };
  }
  s.nextRegularIdx++;
  return { id: s.nextRegularIdx, name: def.name, tag: def.tag, order: def.order,
           trust: Math.round(rnd(52, 68)), visits: 0, weeksIn: 0 };
}

/* ---- save / load ---- */
function save(){
  if (!S) return;
  const data = JSON.stringify(S);
  try { localStorage.setItem(CFG.saveKey, data); }
  catch (e) { MEMSAVE = data; }
}
function loadSave(){
  let data = null;
  try { data = localStorage.getItem(CFG.saveKey); } catch (e) { data = MEMSAVE; }
  if (!data) return null;
  try {
    const s = JSON.parse(data);
    if (s.v !== CFG.version) return null;
    return s;
  } catch (e) { return null; }
}
function clearSave(){
  try { localStorage.removeItem(CFG.saveKey); } catch (e) {}
  MEMSAVE = null;
}

/* ---- formatting ---- */
function fm$(n){
  const neg = n < 0; n = Math.abs(n);
  let out;
  if (n >= 1e9) out = '$' + (n / 1e9).toFixed(2) + 'B';
  else if (n >= 1e6) out = '$' + (n / 1e6).toFixed(1) + 'M';
  else if (n >= 100000) out = '$' + Math.round(n / 1000) + 'k';
  else if (n < 100 && n % 1 !== 0) out = '$' + n.toFixed(2);
  else out = '$' + Math.round(n).toLocaleString('en-US');
  return neg ? '−' + out : out;
}
function fmN(n){
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 10000) return Math.round(n / 1000) + 'k';
  return Math.round(n).toLocaleString('en-US');
}
function esc(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function weekLabel(w){ const y = Math.floor((w - 1) / 52) + 1; const ww = ((w - 1) % 52) + 1; return 'Year ' + y + ' · Week ' + ww; }

/* ============================================================
   MODEL — quality, legibility, demand.
   ============================================================ */
function tierOf(a){ return ATTRS[a].tiers[S.tiers[a]]; }
function attrQ(a){ return tierOf(a).q; }
function attrName(a){ return ATTRS[a].names[Math.min(S.act, 3) - 1]; }
function tierLabel(a, i){
  const t = ATTRS[a].tiers[i];
  return S.act === 1 ? t.name : (S.act === 2 ? t.a2 : t.a3);
}

// Full quality: what someone standing at the counter can check. All of it.
function fullQuality(){
  let q = 0, w = 0;
  QUALITY_ATTRS.forEach(a => { q += attrQ(a) * ATTRS[a].weight; w += ATTRS[a].weight; });
  return q / w;
}
// Illegible quality: the part distance erases.
function illegibleQuality(){
  let q = 0, w = 0;
  QUALITY_ATTRS.forEach(a => {
    if (!S.legible[a]){ q += attrQ(a) * ATTRS[a].weight; w += ATTRS[a].weight; }
  });
  return w > 0 ? q / w : 70;
}
// Legible score: what an ad, a label, or a badge can carry. Claims add to it;
// once an attribute flips legible, your real quality on it counts — relative
// to what the rest of the market prints.
function legibleScore(){
  let score = 55;
  S.claims.forEach(c => { if (CLAIMS[c] && CLAIMS[c].req(S)) score += CLAIMS[c].legQ; });
  QUALITY_ATTRS.forEach(a => {
    if (S.legible[a]){
      const mkt = S.marketLegQ[a] != null ? S.marketLegQ[a] : 60;
      score += Math.max(-18, Math.min(18, (attrQ(a) - mkt) * 0.45));
    }
  });
  return Math.max(0, Math.min(100, score));
}
function verifiableCount(){
  // attributes the current majority customer can check
  if (S.act === 1) return 9;                       // price, photo, and all seven — you are at the counter
  let n = 2;                                       // price, photo
  QUALITY_ATTRS.forEach(a => { if (S.legible[a]) n++; });
  return n;
}
function lin(w, x01){ return 1 + w * (x01 - 0.5); }

/* ---- costs ---- */
function unitCost(){
  let c = CFG.baseUnitCost;
  QUALITY_ATTRS.forEach(a => {
    const t = tierOf(a);
    if (!t.weekly) c += t.cost * S.costMult[a];
  });
  return c;
}
function weeklyFixedPerStore(){
  let f = (S.act === 1 ? CFG.rentWeekly : CFG.storeFixedWeekly) * S.rentMult;
  const k = tierOf('kitchen');
  f += k.cost * S.costMult.kitchen;
  return f;
}
function capacity(){
  let cap = CFG.capacityBase * tierOf('handling').cap;
  if (S.upgrades.griddle) cap *= 1.5;
  if (S.upgrades.griddle2) cap *= 1.35;
  if (S.upgrades.apprentice) cap *= 1.4;
  return cap;
}

/* ---- demand: the two audiences ---- */
function marketing01(spendPerStore){
  return spendPerStore / (spendPerStore + CFG.marketingHalf);
}
function brandFactor(){
  const b = S.brand != null ? S.brand : 62;
  return 0.72 + 0.56 * (b / 100);
}
// Strangers: bandwidth = legible only. This is the substitution rule in code:
// wStrangerMarketing dwarfs wStrangerIllegible.
function strangerDemandPerStore(spendPerStore, baseOverride){
  const base = baseOverride != null ? baseOverride : (S.act === 1 ? S.walkins : (S.act === 2 ? CFG.storeWalkinBase : CFG.act3StoreWalkinBase));
  const priceF = Math.pow(S.marketPrice / S.price, CFG.elasticityStrangers);
  const legF = lin(CFG.wStrangerLegible, legibleScore() / 100);
  const illF = lin(CFG.wStrangerIllegible, illegibleQuality() / 100);
  const mktF = 1 + CFG.wStrangerMarketing * marketing01(spendPerStore);
  return base * priceF * legF * illF * mktF * brandFactor();
}
// Regulars: bandwidth = everything. Marketing is wallpaper to them.
function fairPrice(){
  return S.marketPrice * (0.60 + 0.72 * (fullQuality() / 100));
}
function regularVisitRate(reg){
  const qF = lin(CFG.wRegularFull, fullQuality() / 100);
  const priceF = Math.pow(Math.max(0.5, Math.min(1.35, fairPrice() / S.price)), CFG.elasticityRegulars);
  const trustF = Math.pow(Math.max(10, reg.trust) / 70, 0.8);
  const mktF = 1 + CFG.wRegularMarketing * marketing01(S.marketing);
  return CFG.regularVisitBase * qF * priceF * trustF * mktF;
}

// The spreadsheet the player sees: estimated distant customers per extra
// $1,000/wk of TOTAL spend — the same dollars the slider and the P&L use.
function perThousand(kind){
  const n = storeCount();
  const spend = S.act === 1 ? 0 : S.marketing / Math.max(1, n);
  const now = strangerDemandPerStore(spend);
  if (kind === 'marketing'){
    return (strangerDemandPerStore(spend + 1000 / n) - now) * n;
  }
  return 0;
}
function storeCount(){ return Math.max(1, S.storeCount || 1); }

/* ============================================================
   WEEKLY RESOLUTION — act 1 (the stand)
   ============================================================ */
function resolveWeekAct1(){
  const lines = [];
  const uc = Math.round(unitCost() * 100) / 100, cap = capacity(); // cents, so the receipt reproduces itself

  // regulars come by
  let regularUnits = 0, visitors = [];
  S.regulars.forEach(reg => {
    reg.weeksIn++;
    const rate = regularVisitRate(reg);
    let v = Math.floor(rate) + (chance(rate % 1) ? 1 : 0);
    if (v > 0){ visitors.push(reg); reg.visits += v; regularUnits += v; }
  });

  // strangers walk in
  let strangerUnits = strangerDemandPerStore(0) * rnd(0.92, 1.08);
  let demand = regularUnits + strangerUnits;
  let served = Math.round(Math.min(demand, cap)); // whole burgers — the receipt's math is the real math
  S.turnedAway = Math.max(0, Math.round(demand - cap));
  if (S.turnedAway > 3) lines.push({ note: 'The line ran long — about ' + S.turnedAway + ' people gave up waiting this week.' });

  // money
  const revenue = served * S.price;
  const specials = S.upgrades.specials ? 0.35 * served * 0.2 : 0; // special adds a small attach
  const cogs = served * uc;
  const fixed = weeklyFixedPerStore() + S.debtWeekly + (S.upgrades.apprentice ? 260 : 0);
  const net = revenue + specials - cogs - fixed;
  S.cash += net;

  // trust drift + noticing
  const fq = fullQuality(), fair = fairPrice();
  S.regulars.forEach(reg => {
    const visited = visitors.includes(reg);
    if (fq >= CFG.regularExpectation && S.price <= fair * 1.06){
      reg.trust = Math.min(100, reg.trust + CFG.trustDriftUp);
    } else if (fq < CFG.regularExpectation - 4 || S.price > fair * 1.12){
      reg.trust = Math.max(5, reg.trust - CFG.trustDriftDown);
    }
    if (visited && reg.trust > 55 && chance(0.5)){
      const noticed = Object.keys(S.trimsSinceVisit)[0];
      if (noticed){
        delete S.trimsSinceVisit[noticed];
        reg.trust = Math.max(5, reg.trust - 3);
        lines.push({ who: reg.name, note: pick(NOTICE_LINES)(attrName(noticed).toLowerCase()), delta: '−trust' });
      } else if (chance(0.3)){
        lines.push({ who: reg.name, note: pick(fq >= 82 ? WARM_LINES : NEUTRAL_LINES) });
      }
    }
  });

  // strangers become regulars — faster once the corner has real pull
  if (fq >= CFG.convertQualityMin && S.turnedAway < 8 && S.regulars.length < 120){
    let expect = CFG.convertChance + strangerUnits * 0.006;
    expect *= (fq - CFG.convertQualityMin + 6) / 20;
    if (S.upgrades.specials) expect *= 1.5;
    if (S.upgrades.awning) expect *= 1.2;
    let converts = Math.floor(expect) + (chance(expect % 1) ? 1 : 0);
    converts = Math.min(3, converts);
    for (let i = 0; i < converts; i++){
      const reg = makeRegular(S);
      S.regulars.push(reg);
      if (i === 0) lines.push({ who: reg.name, note: 'ordered three times this week, then introduced ' + (reg.name.includes('&') ? 'themselves' : 'themself') + ' — ' + reg.tag + '.', delta: '+regular' });
      else lines.push({ who: reg.name, note: 'is a face you know now — ' + reg.tag + '.', delta: '+regular' });
    }
  }

  // the receipt: every dollar named, every name a person or a supplier
  const rentNow = CFG.rentWeekly * S.rentMult;
  const kitchenNow = tierOf('kitchen').cost * S.costMult.kitchen;
  const receipt = [];
  receipt.push({ t: 'Sold ' + Math.round(served) + ' burgers at ' + '$' + S.price.toFixed(2), v: revenue });
  if (specials > 0) receipt.push({ t: 'Maya’s special, on the side', v: specials });
  receipt.push({ t: 'Ingredients — ' + tierOf('patty').name + ' & co. (' + Math.round(served) + ' × $' + uc.toFixed(2) + ')', v: -cogs });
  receipt.push({ t: 'Rent' + (S.rentMult > 1.001 ? ' (the new number)' : '') + ' — Marlowe’s office', v: -rentNow });
  receipt.push({ t: tierOf('kitchen').name, v: -kitchenNow });
  if (S.upgrades.apprentice) receipt.push({ t: 'Maya’s wages', v: -260 });
  if (S.debtWeekly > 0) receipt.push({ t: 'The note', v: -S.debtWeekly });
  if (S.prevUC != null && Math.abs(uc - S.prevUC) > 0.005){
    receipt.push({ t: 'One burger now costs $' + uc.toFixed(2) + ' to make (was $' + S.prevUC.toFixed(2) + ')', info: true });
  }
  receipt.push({ t: 'The week, all told', v: net, net: true });
  S.prevUC = uc;

  S.lastWeek = {
    week: S.week, units: Math.round(served), regularUnits: Math.round(regularUnits),
    strangerUnits: Math.round(strangerUnits), revenue, net, uc, fixed, receipt,
  };
  S.feed = lines.slice(0, 7);
  S.servedTotal = (S.servedTotal || 0) + served;
  pushHistory(served);
  S.week++;
  runEventChecks();
}

/* ============================================================
   WEEKLY RESOLUTION — acts 2 & 3 (stores, then the company)
   ============================================================ */
function resolveWeekScale(){
  const n = storeCount();
  const spendPer = S.marketing / n;
  const uc = unitCost();
  let units = 0, loyalUnits = 0;

  const fq = fullQuality();
  const retention = Math.max(0.30, Math.min(0.92,
    0.52 + (fq - 70) * 0.004 + S.sop * 0.045 - Math.max(0, S.price - S.marketPrice) * 0.02));

  S.stores.forEach(st => {
    st.prev = st.units || 0;
    const strangers = strangerDemandPerStore(spendPer, (S.act === 2 ? CFG.storeWalkinBase : CFG.act3StoreWalkinBase) * st.f * S.envMult) * rnd(0.95, 1.05);
    st.loyal = (st.loyal || 40) * retention + strangers * 0.22;
    const lu = st.loyal * 0.85;
    st.units = Math.round(strangers + lu);
    units += st.units; loyalUnits += lu;
  });
  // stores beyond the detail rows: one line of arithmetic each
  const extra = n - S.stores.length;
  if (extra > 0){
    const per = strangerDemandPerStore(spendPer, (S.act === 2 ? CFG.storeWalkinBase : CFG.act3StoreWalkinBase) * S.envMult);
    const perLoyal = per * 0.28;
    units += Math.round((per + perLoyal) * extra);
    loyalUnits += perLoyal * extra;
  }

  // franchise stores: their capital, their costs, your royalty
  const frac = Math.min(0.9, S.franchiseStores / Math.max(1, n));
  const ownRevenue = units * S.price * (1 - frac);
  const royalty = units * S.price * frac * CFG.franchiseRoyalty;
  const revenue = units * S.price;
  const cogs = units * uc * (1 - frac);
  const ownStores = n - S.franchiseStores;
  const fixed = Math.max(1, ownStores) * weeklyFixedPerStore() + S.debtWeekly + S.marketing + (S.sponsored ? revenue * 0.003 : 0);
  let net = ownRevenue + royalty - cogs - fixed;

  // act 3: free cash flow is allocated automatically — the idle engine
  if (S.act === 3 && net > 0){
    const ex = net * S.alloc.expand / 100;
    S.expandPool = (S.expandPool || 0) + ex;
    while (S.storeCount < 4000){
      // wave credits earned on margin discipline discount the next builds
      const per = Math.round(CFG.act3ExpandCostPerStore * (S.waveCredits > 0 ? 1 - CFG.ownedWaveDiscount : 1));
      if (S.expandPool < per) break;
      S.expandPool -= per;
      if (S.waveCredits > 0) S.waveCredits--;
      addStore();
    }
    const mkTarget = Math.min(CFG.marketingMax * n, (net * S.alloc.marketing / 100) * 4);
    S.marketing = Math.round(S.marketing * 0.9 + mkTarget * 0.1);
    const ops = net * S.alloc.ops / 100;
    S.opsPool = (S.opsPool || 0) + ops;
    if (S.opsPool > 60000 && S.sop < 3){ S.opsPool -= 60000; S.sop++; toast('Operations: SOP program level ' + S.sop + ' rolled out systemwide.'); }
    else if (S.opsPool > 90000 && S.testing < 2){ S.opsPool -= 90000; S.testing++; toast('Operations: testing program expanded to level ' + S.testing + '.'); }
    S.cash += net - ex - Math.min(net * S.alloc.ops / 100, ops);
  } else {
    S.cash += net;
  }

  // brand trust drifts home
  if (S.brand == null) S.brand = 62;
  S.brand = Math.min(100, S.brand + 0.55);

  // the sponsored standard reshapes the field: fixed costs thin the small end
  // of the market, and their customers go somewhere with a certified seal
  if (S.sponsored && S.week - (S.sponsoredWeek || 0) < 40){
    S.envMult = Math.min(1.4, S.envMult * 1.011);
  }

  // (reference price moves with the same cost pressure everyone faces — see applyPressure)

  // market catches up on flipped attributes (the arms race / elimination engine)
  QUALITY_ATTRS.forEach(a => {
    if (S.legible[a] && S.marketTarget && S.marketTarget[a] != null){
      const cur = S.marketLegQ[a] != null ? S.marketLegQ[a] : 60;
      S.marketLegQ[a] = cur + (S.marketTarget[a] - cur) * 0.06;
    }
  });

  // incidents: illegible failure, briefly legible
  const risk = tierOf('kitchen').risk * (tierOf('handling').q < 60 ? 1.5 : 1.0);
  const p = CFG.incidentBase * n * risk * (1 - CFG.testingProgramCut * Math.min(1, S.testing / 2)) * (S.sop ? CFG.sopVarianceCut : 1);
  if (chance(Math.min(0.06, p)) && !S.modal && S.week - (S.lastIncidentWk || 0) >= 8){
    S.lastIncidentWk = S.week;
    fireIncident();
  }

  // valuation
  const weeklyEbitda = net + S.marketing * 0.35; // marketing is discretionary; the bank adds some back
  const growth = S.history.length > 12 ? Math.max(0, Math.min(1, (units / Math.max(1, S.history[S.history.length - 12].units) - 1) * 2.2)) : 0.3;
  S.valuation = Math.max(0, weeklyEbitda * 52 * (CFG.ebitdaMultipleBase + CFG.ebitdaMultipleGrowth * growth));

  // feedback deltas: itemized-ish in act 2, aggregates only in act 3
  S.fx = S.fx || {};
  S.fx.floaters = S.fx.floaters || [];
  const prevUnits = S.lastWeek ? S.lastWeek.units : units;
  const dU = units - prevUnits;
  if (Math.abs(dU) / Math.max(prevUnits, 1) > CFG.floaterThreshold){
    S.fx.floaters.push({ key: 'units', text: (dU > 0 ? '+' : '−') + fmN(Math.abs(dU)), dir: dU > 0 ? 'up' : 'dn' });
  }
  const prevNet = S.lastWeek ? S.lastWeek.net : net;
  const dN = net - prevNet;
  if (Math.abs(dN) / Math.max(Math.abs(prevNet), 100) > CFG.floaterThreshold * 2){
    S.fx.floaters.push({ key: 'net', text: (dN > 0 ? '+' : '−') + fm$(Math.abs(dN)), dir: dN > 0 ? 'up' : 'dn' });
  }
  if (S.act === 2 && itemization01() > 0.3){
    // partial itemization: the two stores that moved most
    const movers = S.stores.slice().sort((a, b) => Math.abs(b.units - b.prev) - Math.abs(a.units - a.prev)).slice(0, 2);
    movers.forEach(st => {
      const d = st.units - st.prev;
      if (Math.abs(d) / Math.max(st.prev, 1) > CFG.floaterThreshold * 2){
        S.fx.floaters.push({ key: 'st' + st.id, text: (d > 0 ? '+' : '−') + Math.abs(d), dir: d > 0 ? 'up' : 'dn' });
      }
    });
    // and, now and then, a delta worth saying out loud
    const top = movers[0];
    if (top && S.week >= (S.nextStoreToast || 0)){
      const d = top.units - top.prev;
      if (Math.abs(d) / Math.max(top.prev, 1) > 0.08){
        S.nextStoreToast = S.week + 6;
        toast('Store #' + top.id + ': ' + (d > 0 ? '+' : '−') + Math.abs(d) + ' units this week.');
      }
    }
  }
  // milestones: aggregates celebrate themselves
  const msCandidates = [];
  CFG.milestonesStores.forEach(v => { if (storeCount() >= v) msCandidates.push(['st' + v, fmN(v) + ' locations']); });
  CFG.milestonesUnits.forEach(v => { if (units >= v) msCandidates.push(['u' + v, fmN(v) + ' burgers a week']); });
  CFG.milestonesVal.forEach(v => { if ((S.valuation || 0) >= v) msCandidates.push(['val' + v, fm$(v) + ' valuation']); });
  for (const cand of msCandidates){
    if (!S.fired['ms_' + cand[0]]){
      S.fired['ms_' + cand[0]] = true;
      (S.fx.parties = S.fx.parties || []).push({ label: cand[1] });
      break;
    }
  }

  S.lastWeek = { week: S.week, units, revenue, net, uc, fixed, loyalUnits: Math.round(loyalUnits), retention };
  S.servedTotal = (S.servedTotal || 0) + units;

  // patch 2: capital, rivals, and what scale does on its own
  syncTier();
  checkCovenant();
  franchiseWeekly();
  ownedWeekly();
  rivalWeekly();

  pushHistory(units);
  S.week++;
  runEventChecks();
}

function addStore(){
  S.storeCount++;
  // detail rows cap at 60; beyond that the fleet is simulated in aggregate —
  // which is, of course, also the point
  if (S.stores.length < 60) S.stores.push({ id: S.storeCount, f: rnd(0.82, 1.16), loyal: 30, units: 0 });
}
function pushHistory(units){
  S.history.push({
    w: S.week, units: Math.round(units), cash: Math.round(S.cash),
    legQ: Math.round(legibleScore()), illQ: Math.round(illegibleQuality()),
    regs: S.regulars.length, stores: storeCount(), val: Math.round(S.valuation || 0),
  });
  if (S.history.length > CFG.historyMax) S.history.splice(0, S.history.length - CFG.historyMax);
}

/* ============================================================
   EVENTS — pressure, arcs, flips, memos, gates.
   ============================================================ */
function runEventChecks(){
  // recurring cost pressure
  if (S.week >= S.nextPressure && (!S.ended || S.endless)){
    S.nextPressure = S.week + CFG.inflEvery + Math.floor(rnd(0, 3));
    queueDynamic(makePressure());
  }
  // a rough patch: Marlowe floats a bridge note before the stand goes under
  if (S.act === 1 && S.cash < -900 && (S.bridgeNotes || 0) < 2 && !S.ended){
    S.bridgeNotes = (S.bridgeNotes || 0) + 1;
    S.cash += 1600; S.debtWeekly += 70;
    toast('Marlowe covers the gap with a bridge note: +' + fm$(1600) + ', ' + fm$(70) + '/wk. “Pay me in burgers if you have to.”');
  }
  // recurring expansion offer (until the player settles in)
  if (S.act === 1 && !S.committedLocal && !S.committedScale &&
      S.week >= S.nextExpand && S.cash >= CFG.expandCost && !S.ended){
    S.nextExpand = S.week + 7;
    queueDynamic({ id: 'expandOffer' });
  }
  // local milestones
  if (S.act === 1 && S.localArc < LOCAL_ARCS.length &&
      S.regulars.length >= CFG.localMilestones[S.localArc] &&
      S.week >= (S.arc6Wait || 0)){
    const id = 'localArc' + S.localArc;
    S.localArc++;
    queueEvent(id);
  }
  // scripted events
  EVENT_ORDER.forEach(id => {
    const ev = EVENTS[id];
    if (!S.fired[id] && ev.when && ev.when(S)){ queueEvent(id); }
  });
  checkVolumeThresholds();
  pumpQueue();
}
function queueEvent(id){ if (!S.fired[id]){ S.fired[id] = true; S.queue.push({ id }); } }
function queueDynamic(payload){ S.queue.push(payload); }
function pumpQueue(){
  if (!S.modal && S.queue.length){ S.modal = S.queue.shift(); }
}
function closeModal(){
  S.modal = null;
  pumpQueue();
  save(); render();
}

/* ---- cost pressure: the two levers, priced honestly ---- */
const PRESSURE_TARGETS = ['patty', 'fixed', 'produce', 'oil', 'bun', 'market'];
function makePressure(){
  const t = PRESSURE_TARGETS[(S.pressureIdx = ((S.pressureIdx || 0) + 1)) % PRESSURE_TARGETS.length];
  return { id: 'pressure', target: t };
}
function pressureCopy(t){
  const a1 = S.act === 1;
  switch (t){
    case 'patty': return a1 ? 'Beef is up across the market. ' + tierOf('patty').name + ' has to pass along ' + Math.round(CFG.inflAmount * 100) + '%.' : 'Protein input costs up ' + Math.round(CFG.inflAmount * 100) + '% at current tier, effective immediately.';
    case 'produce': return a1 ? 'A dry month upstream. Produce costs rise ' + Math.round(CFG.inflAmount * 100) + '%.' : 'Produce input +' + Math.round(CFG.inflAmount * 100) + '% on seasonal contract reset.';
    case 'bun': return a1 ? 'Flour is up. The bakery is apologetic but firm: +' + Math.round(CFG.inflAmount * 100) + '%.' : 'Carrier input +' + Math.round(CFG.inflAmount * 100) + '% on renewal.';
    case 'oil': return a1 ? 'Oil prices tick up ' + Math.round(CFG.inflAmount * 100) + '% this quarter.' : 'Fry-medium contract +' + Math.round(CFG.inflAmount * 100) + '%.';
    case 'fixed': return a1 ? 'The landlord sends a friendly note: rent is going up 6%.' : 'Lease escalators and wage floors: fixed costs +6% per location.';
    case 'market': return a1 ? 'Patty Palace, two streets over, drops their price to ' + fm$(S.marketPrice - 0.2) + '. The street notices.' : 'The category leader cuts list price. Reference price now ' + fm$(S.marketPrice - 0.2) + '.';
  }
}
function applyPressure(t){
  if (t === 'fixed'){ S.rentMult *= 1.06; }
  else if (t === 'market'){ S.marketPrice = Math.max(3.9, S.marketPrice - 0.2); return; }
  else { S.costMult[t] *= (1 + CFG.inflAmount); }
  // the rest of the market eats the same increase and passes most of it through
  S.marketPrice *= (1 + CFG.inflAmount * 0.5);
}
// best available trim: next tier down on the attribute saving the most per week
function bestTrim(){
  const vol = S.lastWeek ? Math.max(40, S.lastWeek.units) : 110;
  let best = null;
  QUALITY_ATTRS.forEach(a => {
    if (S.legible[a]) return; // once it's on the label, cutting it costs distant sales — no longer a quiet trim
    const i = S.tiers[a], tiers = ATTRS[a].tiers;
    for (let j = i + 1; j < tiers.length; j++){
      if (tiers[j].hidden && !S.oilReformAvailable) continue;
      if (tiers[j].weekly !== tiers[i].weekly) continue;
      const save_ = (tiers[i].cost - tiers[j].cost) * S.costMult[a];
      const weeklySave = tiers[j].weekly ? save_ : save_ * vol;
      if (save_ > 0 && (!best || weeklySave > best.weeklySave)){
        best = { attr: a, to: j, save: save_, weeklySave, weekly: !!tiers[j].weekly };
      }
      break;
    }
  });
  return best;
}
function demandDeltaForPrice(newPrice){
  const old = S.price;
  const spendPer = S.act === 1 ? 0 : S.marketing / storeCount();
  const s0 = strangerDemandPerStore(spendPer);
  const r0 = S.regulars.reduce((t, r) => t + regularVisitRate(r), 0);
  S.price = newPrice;
  const s1 = strangerDemandPerStore(spendPer);
  const r1 = S.regulars.reduce((t, r) => t + regularVisitRate(r), 0);
  S.price = old;
  return { strangers: s0 > 0 ? (s1 / s0 - 1) : 0, regulars: r0 > 0 ? (r1 / r0 - 1) : 0 };
}
function pressureModal(m){
  const t = m.target;
  const trim = bestTrim();
  m.trim = trim;
  const d = demandDeltaForPrice(S.price + 0.25);
  const choices = [];
  choices.push({ id: 'price', name: 'Raise the price to ' + fm$(S.price + 0.25),
    desc: S.act === 1
      ? 'Counter demand est. ' + pct(d.regulars) + ' · walk-ins est. ' + pct(d.strangers)
      : 'Loyalty cohort est. ' + pct(d.regulars || -0.02) + ' · acquisition est. ' + pct(d.strangers) });
  if (trim){
    const savePct = trim.weekly ? '' : ' (−' + Math.round(trim.save / unitCost() * 100) + '% of unit cost)';
    const dq = (ATTRS[trim.attr].tiers[S.tiers[trim.attr]].q - ATTRS[trim.attr].tiers[trim.to].q) * ATTRS[trim.attr].weight;
    const dRet = (dq * 0.004 * 100).toFixed(1);
    choices.push({ id: 'trim', name: 'Switch ' + attrName(trim.attr).toLowerCase() + ' → ' + tierLabel(trim.attr, trim.to),
      desc: (trim.weekly ? '−' + fm$(trim.save) + '/wk' : '−' + fm$(trim.save) + '/unit' + savePct)
        + ' · identical on all printed attributes'
        + (S.act === 1 ? ' · people at the counter may notice' : ' · retention impact est. −' + dRet + '%') });
  }
  choices.push({ id: 'absorb', name: 'Absorb it', desc: 'Margins thin. Everything else stays exactly as it is.' });
  return {
    kicker: S.act === 1 ? 'The week’s mail' : 'Cost report',
    title: S.act === 1 ? 'Costs are moving' : 'Input cost variance',
    body: '<p>' + esc(pressureCopy(t)) + '</p>',
    choices,
  };
}
function pct(x){ return (x >= 0 ? '+' : '−') + Math.abs(Math.round(x * 100)) + '%'; }
function resolvePressure(m, choiceId){
  applyPressure(m.target);
  if (choiceId === 'price'){
    S.price = Math.round((S.price + 0.25) * 100) / 100;
    const overFair = S.price > fairPrice();
    S.regulars.forEach(r => { r.trust = Math.max(5, r.trust - CFG.priceRaiseTrustCost * (overFair ? 1 : 0.45)); });
    toast('Price is now ' + fm$(S.price) + '.');
  } else if (choiceId === 'trim'){
    const trim = m.trim;
    if (trim){
      setTier(trim.attr, trim.to, true);
      toast(attrName(trim.attr) + ' switched. Unit economics updated.');
    }
  }
  // absorb: costs just went up; nothing else changes
}

/* ---- tier switching (shared by pressure + procurement UI) ---- */
function setTier(attr, idx, silent){
  const from = S.tiers[attr];
  if (from === idx) return;
  S.tiers[attr] = idx;
  const down = ATTRS[attr].tiers[idx].q < ATTRS[attr].tiers[from].q;
  if (down){ S.trimsSinceVisit[attr] = true; }
  else {
    delete S.trimsSinceVisit[attr]; // restored before anyone tasted it
    delete S.fired['vol_' + attr + '_' + idx]; // volume limits re-arm if you climb back up
  }
  if (!silent) toast(attrName(attr) + ': ' + tierLabel(attr, idx) + '.');
}

/* ---- incidents: clinical ---- */
function fireIncident(){
  const storeNo = Math.floor(rnd(1, storeCount() + 1));
  const cat = tierOf('kitchen').risk >= tierOf('handling').q / 60 ? 'sanitation cycle' : 'handling procedure';
  // one store's bad day dilutes across a national brand
  const hit = Math.max(5, Math.round(CFG.incidentTrustHit / Math.sqrt(Math.max(1, storeCount() / 6))));
  S.brand = Math.max(18, (S.brand || 62) - hit);
  queueDynamic({ id: 'incident', storeNo, cat, hit, days: Math.floor(rnd(1, 4)) });
  pumpQueue();
}
function incidentModal(m){
  const saturated = S.testing >= 2;
  const broke = S.cash < 40000;
  const action = saturated
    ? { id: 'audit', name: 'Commission an external audit', desc: fm$(40000) + ' one-time · brand trust +4 · testing already at full coverage', disabled: broke }
    : { id: 'testing', name: 'Expand testing program', desc: fm$(40000) + ' one-time · incident probability −' + Math.round(CFG.testingProgramCut * 50) + '% · brand trust +4', disabled: broke };
  return {
    kicker: 'Operations',
    title: 'Incident report — Store #' + m.storeNo,
    body: '<div class="memo"><div class="mh">Summary</div>'
      + 'Category: ' + esc(m.cat) + '<br>Local coverage: ' + (m.days || 2) + ' days<br>'
      + 'Brand trust: −' + (m.hit || CFG.incidentTrustHit) + '<br>'
      + 'Recommended: ' + (saturated ? 'external audit' : 'expand testing program') + '</div>',
    choices: [action, { id: 'file', name: 'Note and file', desc: 'No change.' }],
  };
}
function resolveIncident(m, choiceId){
  if ((choiceId === 'testing' || choiceId === 'audit') && S.cash >= 40000){
    S.cash -= 40000;
    if (choiceId === 'testing') S.testing = Math.min(2, S.testing + 1);
    S.brand = Math.min(100, S.brand + 4);
  }
  S.hadIncident = true;
}

/* ---- the interface keys to scale, never to funding ----
   Store count and weekly customers decide what the player's own
   screen can still see. Money only ever buys more stores. */
function computeTier(){
  const n = storeCount();
  const units = S.lastWeek ? S.lastWeek.units : 0;
  if (S.act === 4) return 4; // the Continuation does not un-happen
  if (n >= CFG.tier3Stores || units >= CFG.tier3Units) return 3;
  if (n >= CFG.tier2Stores) return 2;
  return 1;
}
function syncTier(){
  const t = computeTier();
  if (t <= S.act) return;
  S.act = t;
  S.screen = 'act' + t;
  if (t === 2){ S.act2StartWeek = S.act2StartWeek || S.week; queueEvent('act2open'); }
  if (t === 3){ S.act3StartWeek = S.act3StartWeek || S.week; queueEvent('act3open'); }
}

/* ---- opening the second counter (any money will do) ---- */
function goScale(){
  S.committedScale = true;
  S.cash -= CFG.expandCost;
  S.debtWeekly += CFG.storeLoanWeekly;
  S.storeCount = 2;
  S.stores = [
    { id: 1, f: 1.05, loyal: S.regulars.length * 1.6, units: 0 },
    { id: 2, f: rnd(0.86, 1.1), loyal: 22, units: 0 },
  ];
  S.marketing = 0;
  S.rival = Math.max(S.rival || CFG.rivalStart, CFG.rivalStart);
  syncTier();
}

/* ---- capital routes ---- */
function acceptPartner(){
  S.routes.partner = true;
  S.cash += CFG.partnerCash;
  S.meridianShare = CFG.partnerShare;
  const units = S.lastWeek ? S.lastWeek.units : 500;
  S.cov = { due: S.week + CFG.covenantWeeks, target: Math.round(units * CFG.covenantGrowth), misses: 0 };
  toast('Meridian wire received: ' + fm$(CFG.partnerCash) + '. First growth target on the books.');
}
function acceptFranchise(){
  S.routes.franchise = true;
  S.nextPetition = S.week + CFG.franchisePetitionEvery;
  toast('Franchise program filed. The first applications arrive by Friday.');
}
function checkCovenant(){
  if (!S.cov || S.ended) return;
  if (S.week < S.cov.due) return;
  const units = S.lastWeek ? S.lastWeek.units : 0;
  if (units >= S.cov.target){
    S.cash += CFG.covenantTrancheCash;
    S.cov = { due: S.week + CFG.covenantWeeks, target: Math.round(units * CFG.covenantGrowth), misses: S.cov.misses };
    toast('Growth target met. Meridian releases the next tranche: ' + fm$(CFG.covenantTrancheCash) + '.');
  } else {
    S.cov.misses++;
    if (S.cov.misses >= CFG.covenantMissLimit){
      queueDynamic({ id: 'ousterVote' });
      return;
    }
    const missed = S.cov.target;
    S.meridianShare = Math.min(0.75, S.meridianShare + CFG.covenantDilution);
    S.cov.due = S.week + CFG.covenantWeeks;
    S.cov.target = Math.round(Math.max(units * CFG.covenantGrowth, S.cov.target));
    queueDynamic({ id: 'covenantMiss', missed });
  }
}
function franchiseWeekly(){
  if (!S.routes.franchise || (S.ended && !S.endless)) return;
  if (S.week < (S.franchisePause || 0)){ return; }
  const p = CFG.franchiseGrowthBase + CFG.franchiseAuditBonus * S.auditProgram + (S.brand > 70 ? 0.08 : 0);
  if (chance(Math.min(0.75, p))){
    addStore();
    S.franchiseStores++;
  }
  if (S.week >= S.nextPetition && !S.modal && bestTrim()){
    S.nextPetition = S.week + CFG.franchisePetitionEvery;
    queueDynamic({ id: 'petition' });
  }
}
function ownedWeekly(){
  if (S.ended && !S.endless) return;
  const margin = S.price - unitCost();
  if (margin >= CFG.ownedMarginTarget){
    S.marginStreak++;
    if (S.marginStreak >= CFG.ownedStreakWeeks){
      S.marginStreak = 0;
      S.waveCredits += CFG.ownedWaveCredits;
      toast('Margins held ' + CFG.ownedStreakWeeks + ' straight weeks — expansion wave: ' + CFG.ownedWaveCredits + ' discounted builds available.');
    }
  } else {
    S.marginStreak = 0;
  }
}
function rivalWeekly(){
  // the rival grows opportunistically: faster whenever you don't
  const myUnits = S.lastWeek ? S.lastWeek.units : 0;
  const growing = S.rivalPrev > 0 && myUnits > S.rivalPrev * 1.015;
  S.rivalPrev = myUnits;
  const g = growing ? CFG.rivalBaseGrowth : CFG.rivalOppGrowth;
  S.rival = S.rival * (1 + g) + (growing ? 0 : 0.05);
  if (S.rival > storeCount()){
    S.marketPrice = Math.max(3.9, S.marketPrice * CFG.rivalPricePressure);
  }
}

function endRun(kind){
  S.ended = kind;
  S.screen = 'ceremony';
  S.modal = null; S.queue = [];
  stopTicker();
}

/* ---- small chart builders for reveals ---- */
function trendHTML(vals, color, label){
  const mx = Math.max.apply(null, vals.map(Math.abs).concat([1]));
  const first = vals[0], last = vals[vals.length - 1];
  const shape = last > first * 1.15 ? 'rising' : (last < first * 0.85 ? 'falling' : 'roughly flat');
  const aria = (label ? label + ': ' : '') + shape + ', ' + first + ' to ' + last;
  return '<div class="trend" role="img" aria-label="' + esc(aria) + '">' + vals.map(v =>
    '<span style="height:' + Math.max(6, Math.round(Math.abs(v) / mx * 60)) + 'px;background:' + color + '"></span>'
  ).join('') + '</div>';
}
function revealRow(label, vals, color){
  return '<div class="small" style="margin-top:8px"><b>' + esc(label) + '</b></div>' + trendHTML(vals, color, label);
}

const LANG4 = ['customers', 'members', 'residents', 'served'];

function startContinuation(){
  const income = Math.max(120000, S.lastWeek ? S.lastWeek.net : 200000);
  S.c4 = {
    rung: 0,
    income,
    cost: Math.round(income * CFG.act4RungWait * 0.4), // the first rung comes quicker
    churn: CFG.act4ChurnStart,
    servedWk: S.lastWeek ? S.lastWeek.units : 100000,
    lang: 0, done100: false, idle: 0,
  };
  S.act = 4;
  S.screen = 'act4';
}
function resolveWeekAct4(){
  const c = S.c4;
  S.cash += c.income;
  S.servedTotal += c.servedWk;
  c.servedWk = Math.round(c.servedWk * 1.002);
  // the register only escalates once its rung has been bought
  const noun = c.lang >= 2 ? 'Resident' : (c.lang >= 1 ? 'Member' : 'Customer');
  if (!c.done100 && chance(0.05)){
    toast(noun + ' churn ' + c.churn.toFixed(1) + '%/yr — cites: ' + pick(CHURN_CITES) + '.');
  }
  if (!c.done100 && c.rung >= 4 && chance(0.025)){
    toast('Disturbance at Site ' + Math.floor(rnd(2, 40)) + '. Output resumed ' + pick(['Thursday', 'by morning', 'within the hour']) + '.');
  }
  if (c.rung >= LADDER.length && c.done100){
    c.idle++;
    if (c.idle > 16){ S.screen = 'sign'; S.signT0 = Date.now(); }
  }
  S.week++;
}
function buyRung(){
  const c = S.c4;
  if (!c || c.rung >= LADDER.length) return;
  const rung = LADDER[c.rung];
  if (S.cash < c.cost) return;
  S.cash -= c.cost;
  c.rung++;
  c.lang = Math.max(c.lang, rung.lang);
  c.income = Math.round(c.income * rung.mult);
  c.servedWk = Math.round(c.servedWk * rung.mult);
  c.cost = Math.round(c.income * CFG.act4RungWait);
  if (!c.done100){
    c.churn = Math.max(0, c.churn - rung.churn);
    if (c.churn <= 0.001){
      c.churn = 0; c.done100 = true;
      S.fx = S.fx || {};
      (S.fx.parties = S.fx.parties || []).push({ label: 'Retention: 100.00%' });
    }
  }
  toast(rung.name + ' — approved.');
  save(); render();
}

/* ============================================================
   AUDIO — everything synthesized in code. No files, no melody
   you could hum in act 1, and by act 3 no world left to hear.
   ============================================================ */
const AUDIO = {
  ctx: null, master: null, started: false,
  scene: null, sceneBus: null, sceneStop: null,
  arpTimer: null, padTimer: null,
  pref: (function(){ try { return JSON.parse(localStorage.getItem(CFG.audioPrefKey) || '{}'); } catch (e) { return {}; } })(),
  get muted(){ return !!this.pref.muted; },
  get vol(){ return this.pref.vol != null ? this.pref.vol : CFG.audioDefaultVol; },
  savePref(){ try { localStorage.setItem(CFG.audioPrefKey, JSON.stringify(this.pref)); } catch (e) {} },

  start(){
    if (this.started) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.started = true;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
    if (!this.muted){
      this.master.gain.linearRampToValueAtTime(this.vol, this.ctx.currentTime + 1.4); // page loads silent; fade in on first gesture
    } else {
      this.ctx.suspend();
    }
    const want = this.scene; this.scene = null;
    this.setScene(want || 'quiet');
  },
  setMuted(m){
    this.pref.muted = m; this.savePref();
    if (!this.ctx) return;
    if (m){
      this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.08);
      setTimeout(() => { if (this.muted && this.ctx) this.ctx.suspend(); }, 350);
    } else {
      this.ctx.resume();
      this.master.gain.setTargetAtTime(this.vol, this.ctx.currentTime, 0.15);
    }
  },
  setVol(v){
    this.pref.vol = v; this.savePref();
    if (this.ctx && !this.muted) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1);
  },

  _noiseBuf: null,
  noise(){
    if (!this._noiseBuf){
      const len = this.ctx.sampleRate * 2;
      this._noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this._noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf; src.loop = true;
    return src;
  },

  /* ---- scenes ---- */
  setScene(name){
    if (name === this.scene) return;
    this.scene = name;
    if (!this.ctx) return;
    // fade out the old bed
    if (this.sceneBus){
      const old = this.sceneBus, oldStop = this.sceneStop;
      old.gain.setTargetAtTime(0, this.ctx.currentTime, 0.7);
      setTimeout(() => { try { oldStop && oldStop(); old.disconnect(); } catch (e) {} }, 2600);
    }
    if (this.arpTimer){ clearInterval(this.arpTimer); this.arpTimer = null; }
    if (this.padTimer){ clearInterval(this.padTimer); this.padTimer = null; }
    this.sceneBus = null; this.sceneStop = null;
    if (name === 'quiet') return;
    const bus = this.ctx.createGain();
    bus.gain.value = 0;
    bus.connect(this.master);
    bus.gain.setTargetAtTime(1, this.ctx.currentTime + 0.2, 1.0); // crossfade in
    this.sceneBus = bus;
    if (name === 'act1') this.sceneStop = this.buildAct1(bus);
    else if (name === 'act2') this.sceneStop = this.buildAct2(bus);
    else if (name === 'act3') this.sceneStop = this.buildAct3(bus);
  },

  // Act 1: griddle, room, a radio you can't quite make out. No music.
  buildAct1(bus){
    const c = this.ctx, nodes = [];
    // griddle sizzle
    const siz = this.noise();
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3400;
    const sg = c.createGain(); sg.gain.value = 0.016;
    const lfo = c.createOscillator(); lfo.frequency.value = 6.3;
    const lg = c.createGain(); lg.gain.value = 0.007;
    lfo.connect(lg); lg.connect(sg.gain);
    siz.connect(hp); hp.connect(sg); sg.connect(bus);
    siz.start(); lfo.start(); nodes.push(siz, lfo);
    // room / street tone
    const room = this.noise();
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    const rg = c.createGain(); rg.gain.value = 0.035;
    room.connect(lp); lp.connect(rg); rg.connect(bus);
    room.start(); nodes.push(room);
    // the radio: detuned murmur through a wandering bandpass — never a melody
    const r1 = c.createOscillator(); r1.type = 'sawtooth'; r1.frequency.value = 147;
    const r2 = c.createOscillator(); r2.type = 'sawtooth'; r2.frequency.value = 151;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 6;
    const wander = c.createOscillator(); wander.frequency.value = 0.07;
    const wg = c.createGain(); wg.gain.value = 320;
    wander.connect(wg); wg.connect(bp.frequency);
    const mur = c.createGain(); mur.gain.value = 0.012;
    const wob = c.createOscillator(); wob.frequency.value = 0.31;
    const wobg = c.createGain(); wobg.gain.value = 0.006;
    wob.connect(wobg); wobg.connect(mur.gain);
    r1.connect(bp); r2.connect(bp); bp.connect(mur); mur.connect(bus);
    r1.start(); r2.start(); wander.start(); wob.start(); nodes.push(r1, r2, wander, wob);
    return () => nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  },

  // Act 2: the ambience thins; a sparse, pleasant pad breathes underneath.
  buildAct2(bus){
    const c = this.ctx, nodes = [];
    const siz = this.noise();
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3600;
    const sg = c.createGain(); sg.gain.value = 0.005;
    siz.connect(hp); hp.connect(sg); sg.connect(bus);
    siz.start(); nodes.push(siz);
    const chords = [[130.81, 164.81, 196.0, 246.94], [174.61, 220.0, 261.63, 329.63]];
    let ci = 0;
    const swell = () => {
      if (this.scene !== 'act2' || document.hidden || this.muted) return;
      const freqs = chords[ci % chords.length]; ci++;
      freqs.forEach((f, i) => {
        const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = (i % 2 ? 4 : -4);
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850;
        const g = c.createGain(); g.gain.value = 0;
        const t = c.currentTime;
        g.gain.linearRampToValueAtTime(0.014, t + 2.8);
        g.gain.linearRampToValueAtTime(0, t + 8.5);
        o.connect(lp); lp.connect(g); g.connect(bus);
        o.start(t); o.stop(t + 9);
      });
    };
    swell();
    this.padTimer = setInterval(swell, 9000);
    return () => nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  },

  // Act 3: the productivity bed. Gridded, airy, synthetic. Nothing sizzles.
  buildAct3(bus){
    const c = this.ctx, nodes = [];
    // sustained air pad — A minor, so every arp tone sits inside it
    [220.0, 261.63, 329.63].forEach((f, i) => {
      const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = i * 3 - 3;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      const g = c.createGain(); g.gain.value = 0.010;
      o.connect(lp); lp.connect(g); g.connect(bus);
      o.start(); nodes.push(o);
    });
    // light arpeggio on a grid, ~96bpm eighths, pentatonic and pleasant
    const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.7];
    const pattern = [0, 2, 4, 6, 4, 2, 3, 5];
    let step = 0, nextT = 0;
    const tick = () => {
      if (this.scene !== 'act3' || document.hidden || this.muted) return;
      const now = c.currentTime;
      if (nextT < now) nextT = now + 0.05;
      while (nextT < now + 0.35){
        const f = scale[pattern[step % pattern.length]];
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = c.createGain(); g.gain.value = 0;
        g.gain.setValueAtTime(0, nextT);
        g.gain.linearRampToValueAtTime(0.020, nextT + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0004, nextT + 0.26);
        o.connect(g); g.connect(bus);
        o.start(nextT); o.stop(nextT + 0.3);
        if (step % 2 === 0){ // airy hat
          const h = this.noise();
          const hpf = c.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 8500;
          const hg = c.createGain(); hg.gain.value = 0;
          hg.gain.setValueAtTime(0, nextT);
          hg.gain.linearRampToValueAtTime(0.012, nextT + 0.004);
          hg.gain.exponentialRampToValueAtTime(0.0004, nextT + 0.05);
          h.connect(hpf); hpf.connect(hg); hg.connect(bus);
          h.start(nextT); h.stop(nextT + 0.07);
        }
        step++; nextT += 0.3125; // 96bpm eighths
      }
    };
    this.arpTimer = setInterval(tick, 180);
    return () => nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  },

  /* ---- one-shots ---- */
  blip(freq, dur, gain, type){
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = c.createGain(); g.gain.value = 0;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0004, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noiseHit(freqLo, freqHi, dur, gain){
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const n = this.noise();
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = (freqLo + freqHi) / 2; bp.Q.value = 1.2;
    const g = c.createGain(); g.gain.value = 0;

/* ============================================================
   FEEDBACK — rolling numbers, floaters, confetti.
   ============================================================ */
const NUMC = {}; // last shown value per number key
function fmtNum(v, f){
  switch (f){
    case '$': return fm$(v);
    case 'n': return fmN(v);
    case 'p2': return '$' + v.toFixed(2);
    case 'pct': return Math.round(v) + '%';
    case 'd': { const r = Math.round(v); return r === 0 ? '—' : (r > 0 ? '+' : '−') + Math.abs(r); }
    default: return String(Math.round(v));
  }
}
function weekLabelHTML(w){
  const y = Math.floor((w - 1) / 52) + 1; const ww = ((w - 1) % 52) + 1;
  return 'Year ' + y + ' · Week ' + nk('week', ww, 'i');
}
function nk(key, raw, fmt){
  return '<span class="nkv" data-nk="' + key + '" data-val="' + raw + '" data-fmt="' + fmt + '">' + fmtNum(raw, fmt) + '</span>';
}
function flashEl(el){
  const host = el.closest('.kpi') || el;
  host.classList.remove('hl'); void host.offsetWidth;
  host.classList.add('hl');
  setTimeout(() => host.classList.remove('hl'), 650);
}
function rollNumbers(){
  app.querySelectorAll('[data-nk]').forEach(el => {
    const k = el.dataset.nk, f = el.dataset.fmt;
    const v = parseFloat(el.dataset.val);
    if (isNaN(v)) return;
    const prev = NUMC[k];
    NUMC[k] = v;
    if (prev == null || prev === v) return;
    const sig = Math.abs(v - prev) / Math.max(Math.abs(prev), 1) > 0.005;
    if (sig) flashEl(el);
    if (RM.matches) return; // reduced motion: instant value + highlight only
    const t0 = performance.now(), dur = 420;
    const stepFn = t => {
      if (!el.isConnected){ return; }
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtNum(prev + (v - prev) * e, f);
      if (p < 1) requestAnimationFrame(stepFn);
    };
    requestAnimationFrame(stepFn);
  });
}
function spawnFloaters(){
  if (!S || !S.fx || !S.fx.floaters || !S.fx.floaters.length) return;
  const list = S.fx.floaters.slice(-6); // only this tick's worth, never a backlog
  S.fx.floaters = [];
  // reduced motion still gets the floaters — statically, via the RM CSS block
  if (!celebrating() || document.hidden) return;
  list.forEach((fl, i) => {
    const host = app.querySelector('[data-nk="' + fl.key + '"]');
    const card = host && (host.closest('.kpi') || host.closest('td'));
    if (!card) return;
    const sp = document.createElement('span');
    sp.className = 'floater ' + (fl.dir || 'up');
    sp.textContent = fl.text;
    sp.style.top = (2 + i * 12) + 'px';
    card.appendChild(sp);
    setTimeout(() => { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 1100);
  });
}
function throwConfetti(){
  if (RM.matches || !celebrating() || document.hidden) return;
  const n = Math.round(14 + 34 * juice01());
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  layer.setAttribute('aria-hidden', 'true');
  const colors = ['#f5b63d', '#79b04f', '#d84f37', '#4f8ef7', '#efab55', '#e8a24f'];
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dur', (0.9 + Math.random() * 0.7) + 's');
    s.style.setProperty('--rot', Math.round(300 + Math.random() * 480) + 'deg');
    s.style.animationDelay = (Math.random() * 0.25) + 's';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(() => { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 2100);
}
function handleParty(){
  if (!S || !S.fx) return;
  // legacy single-slot support, then the queue
  if (S.fx.party){ (S.fx.parties = S.fx.parties || []).push(S.fx.party); S.fx.party = null; }
  if (!S.fx.parties || !S.fx.parties.length) return;
  const party = S.fx.parties.shift();
  toast('Milestone — ' + party.label + '.', 'badge-toast');
  if (!celebrating()) return;

  const j = juice01();
  if (j > 0.7){ throwConfetti(); AUDIO.fanfare(); }
  else if (j > 0.4){ AUDIO.coin(); }
}
